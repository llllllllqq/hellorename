name: Emulator UI verification

# 由 QA 和 Release workflow 通过 workflow_call 复用。
# Release workflow 的发布 job 以 needs 依赖本 workflow：模拟器验证不通过就不会发布。
on:
  workflow_call:

permissions:
  contents: read

jobs:
  emulator:
    name: UI tests on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      # GitHub 托管 runner 上的 /dev/kvm 默认权限不一定够 emulator 用
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 确认 emulator-runner 的 script 里能直接调用 gradle
      - name: Verify Gradle availability
        run: gradle --version

      - name: Run emulator UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim
          script: bash .github/scripts/emulator_ui_check.sh

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-ui-evidence
          path: |
            app/build/reports/ui/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
