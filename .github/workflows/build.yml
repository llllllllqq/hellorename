name: Release APK

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::发布构建必须配置签名 Secrets（SIGNING_KEYSTORE_BASE64 等），否则会产出 debug 签名的包"
            exit 1
          fi

      - name: Decode signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -e
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          DIGEST="$(keytool -list -v -keystore "$RUNNER_TEMP/release.jks" \
            -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" \
            | grep -m1 'SHA256:' | awk '{print $2}' | tr -d ':' | tr 'A-Z' 'a-z')"
          echo "证书 SHA-256: $DIGEST"
          {
            echo "cert=$DIGEST"
            echo "file=$RUNNER_TEMP/release.jks"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve version
        id: version
        run: |
          set -e
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="0.0.1-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "构建版本: $NAME (versionCode=${GITHUB_RUN_NUMBER})"

      - name: Build release APK
        env:
          SIGNING_STORE_FILE: ${{ steps.keystore.outputs.file }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          gradle --no-daemon --stacktrace assembleRelease \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${GITHUB_RUN_NUMBER}"

      - name: Collect APK
        id: collect
        run: |
          set -e
          VERSION="${{ steps.version.outputs.name }}"
          mkdir -p dist
          APK="dist/hellorename-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          (cd dist && sha256sum "hellorename-${VERSION}.apk" > SHA256SUMS.txt)
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          ls -l dist

      - name: QA check APK
        run: |
          python3 tools/qa_check.py "${{ steps.collect.outputs.apk }}" \
            --expect-version-name "${{ steps.version.outputs.name }}" \
            --expect-cert-sha256 "${{ steps.keystore.outputs.cert }}" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: hellorename-${{ steps.version.outputs.name }}
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          CERT: ${{ steps.keystore.outputs.cert }}
        run: |
          set -e
          python3 tools/changelog_notes.py "$TAG" CHANGELOG.md > "$RUNNER_TEMP/notes.md" || true
          {
            cat "$RUNNER_TEMP/notes.md"
            echo
            echo "---"
            echo
            echo '本包已签名，证书 SHA-256: `'"$CERT"'`'
            echo
            echo '校验安装包完整性: `sha256sum -c SHA256SUMS.txt`'
          } > "$RUNNER_TEMP/release-notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt \
              --title "$TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
