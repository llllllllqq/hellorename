name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Require signing secrets when building a tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::发布 tag 必须配置签名 Secrets，否则会产出 debug 签名的包"
            exit 1
          fi

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::SIGNING_KEYSTORE_BASE64 未配置，release 将退回 debug 签名"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ls -l "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          SIGNING_STORE_FILE: ${{ (secrets.SIGNING_KEYSTORE_BASE64 != '' && format('{0}/release.jks', runner.temp)) || '' }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Collect APK
        id: collect
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          APK="dist/hellorename-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          (cd dist && sha256sum "hellorename-${VERSION}.apk" > SHA256SUMS.txt)
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          ls -l dist

      - name: Verify APK signature
        run: |
          set -e
          APK="${{ steps.collect.outputs.apk }}"
          if [ -z "$ANDROID_HOME" ]; then echo "no ANDROID_HOME, skip"; exit 0; fi
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "using $BT"
          "$BT/apksigner" verify --print-certs "$APK" | head -20

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: hellorename-apk-${{ github.ref_name }}
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt \
              --title "$TAG" \
              --generate-notes
          fi
